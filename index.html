const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* ---------- toast & copy ---------- */
let tT; function toast(msg){ const t=$('#toast'); t.firstChild.textContent=msg; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),1600); }
async function copy(text){
  const legacy=()=>{ try{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(_){ return false; } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ const ok=await Promise.race([navigator.clipboard.writeText(text).then(()=>true), new Promise(r=>setTimeout(()=>r('timeout'),700))]); if(ok===true) return true; }catch(e){}
  }
  return legacy();
}
function openUrl(u){ const a=document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }

function closeOv(id){ $('#'+id).classList.remove('open'); if(!$$('.ov.open').length) document.body.classList.remove('lock'); }

$$('.ov [data-go]').forEach(b=>b.addEventListener('click',()=>{ const cur=b.closest('.ov').id; closeOv(cur); openOv(b.dataset.go,''); }));

$$('.rows').forEach(r=>{ r.dataset.nums.split(',').forEach((num,i)=>{ const y=[187,248,310][i];

/* ---------- RSVP form ---------- */

const ARW=c=>`<svg width="10" height="5" viewBox="0 0 10 5"><path d="M.6.6 5 4.4 9.4.6" fill="none" stroke="${c}" stroke-width="1.2"/></svg>`;

/* ---------- 메인 배경 눈 (피그마 셰이더 '청첩장 · 눈과 3분 적설' 이식: 3분 동안 바닥에 60px 쌓임) ---------- */
function startSnow(){
  const cv=$('#snow'); const gl=cv.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false}); if(!gl) return;
  const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  const fs=`precision highp float;
  uniform vec2 uRes; uniform float uDpr; uniform vec2 uOrigin; uniform float uZoom; uniform vec2 uPage; uniform float uT;
  float hash(vec2 v){return fract(sin(dot(v,vec2(127.1,311.7)))*43758.5453);}
  float seg(vec2 q,vec2 a,vec2 b){vec2 ab=b-a;return length(q-a-ab*clamp(dot(q-a,ab)/dot(ab,ab),0.,1.));}
  float flake(vec2 q,float r){ if(length(q)>r+1.2) return 0.; float d=100.;
    for(int i=0;i<6;i++){ float an=float(i)*1.04719755; vec2 ax=vec2(cos(an),sin(an)); vec2 sd=vec2(-ax.y,ax.x);
      d=min(d,seg(q,vec2(0.),ax*r)); vec2 j=ax*r*.57; d=min(d,seg(q,j,j-ax*r*.19+sd*r*.22)); d=min(d,seg(q,j,j-ax*r*.19-sd*r*.22)); }
    return 1.-smoothstep(.34,.95,d); }
  void main(){
    vec2 css=vec2(gl_FragCoord.x, uRes.y-gl_FragCoord.y)/uDpr;
    vec2 pos=(css-uOrigin)/uZoom; float W=uPage.x, H=uPage.y;
    if(pos.x<0.||pos.x>W||pos.y<0.||pos.y>H){gl_FragColor=vec4(0.);return;}
    float snow=0.;
    for(int l=0;l<3;l++){ float sd=float(l)*41.7; float sp=15.+float(l)*4.5; vec2 cs=vec2(95.,245.);
      vec2 mv=pos-vec2(0.,uT*sp); vec2 g=floor(mv/cs);
      for(int iy=-1;iy<=1;iy++){ for(int ix=-1;ix<=1;ix++){
        vec2 c=g+vec2(float(ix),float(iy)); float h=hash(c+sd);
        vec2 ce=(c+vec2(.16+.68*h,.15+.7*hash(c+sd+19.)))*cs; float dr=7.*sin(uT*.18+h*6.283);
        snow=max(snow,flake(mv-ce-vec2(dr,0.),2.2+3.2*h)*(.36+.36*h)); }}}
    float pr=clamp(uT/180.,0.,1.); float ux=pos.x/W;
    float edge=60.*pr*(.86+.08*sin(ux*8.+.4)+.06*sin(ux*17.));
    float bank=(1.-smoothstep(edge-.7,edge+.7,H-pos.y))*step(.001,pr);
    float al=max(snow,bank*.96);
    gl_FragColor=vec4(vec3(.99,.995,1.)*al,al);
  }`;
  const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;};
  const pg=gl.createProgram(); gl.attachShader(pg,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(pg);
  if(!gl.getProgramParameter(pg,gl.LINK_STATUS)) return;
  gl.useProgram(pg); const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pg,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pg,n); const uRes=U('uRes'),uDpr=U('uDpr'),uOrigin=U('uOrigin'),uZoom=U('uZoom'),uPage=U('uPage'),uT=U('uT');
  const dpr=Math.min(window.devicePixelRatio||1,1.5); let t0=performance.now(), last=0;
  function frame(now){
    requestAnimationFrame(frame); if(document.hidden) return;
    const w=Math.round(innerWidth*dpr), h=Math.round(innerHeight*dpr); if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
    gl.viewport(0,0,w,h); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    const r=app.getBoundingClientRect(); const z=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z'))||1;
    gl.uniform2f(uRes,w,h); gl.uniform1f(uDpr,dpr); gl.uniform2f(uOrigin,r.left,r.top); gl.uniform1f(uZoom,z); gl.uniform2f(uPage,390,r.height/z); gl.uniform1f(uT,(now-t0)/1000);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
}

/* ---------- instax stack ---------- */
const SLOT={ front:[1,0,0,1,67.5,40], second:[0.99452,-0.10453,0.10453,0.99452,46.9965,58.1765], third:[0.99452,0.10453,-0.10453,0.99452,89.4004,31.5217], flick:[0.97030,0.24192,-0.24192,0.97030,278.785,-14.2409] };
const mtx=a=>`matrix(${a.join(',')})`;
const N=13, stack=$('#instax'), cards=[];
for(let i=1;i<=N;i++){ const c=document.createElement('div'); c.className='card'; c.innerHTML=`<img src="assets/card${i}.webp" alt="사진 ${i}" draggable="false">`; stack.appendChild(c); cards.push(c); }
const numImg=document.createElement('img'); numImg.id='instaxNum'; numImg.alt=''; stack.appendChild(numImg);
for(let i=1;i<=N;i++){ const im=new Image(); im.src=`assets/num${i}.webp`; }
let cur=0, busy=false;
function layout(trans){
  cards.forEach((c,i)=>{ const k=(i-cur+N)%N; c.style.transition=trans||'none';
    c.style.transform=mtx(k===0?SLOT.front:k===1?SLOT.second:SLOT.third); c.style.opacity=k<=2?1:0; c.style.zIndex=100-k; });
  numImg.src=`assets/num${cur+1}.webp`;
}
layout();
function next(){ if(busy) return; busy=true; const c=cards[cur];
  c.style.transition='transform .22s ease-out'; c.style.transform=mtx(SLOT.flick);
  setTimeout(()=>{ c.style.zIndex=0; cur=(cur+1)%N; layout('transform .38s ease-in-out, opacity .38s ease-in-out'); c.style.zIndex=0; setTimeout(()=>{ layout(); busy=false; },400); },230); }
function prev(){ if(busy) return; busy=true; const p=(cur-1+N)%N, c=cards[p];
  c.style.transition='none'; c.style.zIndex=200; c.style.opacity=1; c.style.transform=mtx(SLOT.flick); void c.offsetWidth;
  cur=p; cards.forEach((x,i)=>{ if(i===p) return; const k=(i-cur+N)%N; x.style.transition='transform .38s ease-in-out, opacity .38s ease-in-out'; x.style.transform=mtx(k===1?SLOT.second:SLOT.third); x.style.opacity=k<=2?1:0; x.style.zIndex=100-k; });
  c.style.transition='transform .38s ease-in-out'; c.style.transform=mtx(SLOT.front); numImg.src=`assets/num${cur+1}.webp`;
  setTimeout(()=>{ layout(); busy=false; },400); }
let sx=null, sy=null, moved=false;
stack.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; moved=false; });
stack.addEventListener('pointermove',e=>{ if(sx!==null && Math.abs(e.clientX-sx)>8) moved=true; });
stack.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)>30 && Math.abs(dx)>Math.abs(dy)) { dx>0? next() : prev(); } else if(!moved && Math.abs(dy)<10) next(); });
stack.addEventListener('pointercancel',()=>{ sx=null; });

/* ---------- map (네이버 실시간 지도 · 드래그/확대 가능) ---------- */
(function(){
  const box=$('#map'); const sandboxed=/claude|anthropic/i.test(location.hostname);
  const ph=msg=>box.innerHTML=`<div class="ph"><b>경기교총웨딩하우스</b>${msg}</div>`;
  if(CONFIG.NAVER_MAP_KEY){
    const s=document.createElement('script'); s.src=`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${CONFIG.NAVER_MAP_KEY}&submodules=geocoder`;
    s.onload=()=>{ const draw=p=>{ const m=new naver.maps.Map(box,{center:p,zoom:16,zoomControl:true,zoomControlOptions:{position:naver.maps.Position.TOP_RIGHT,style:naver.maps.ZoomControlStyle.SMALL},scaleControl:false,mapDataControl:false,logoControlOptions:{position:naver.maps.Position.BOTTOM_LEFT}}); new naver.maps.Marker({position:p,map:m}); };
      if(VENUE.lat) return draw(new naver.maps.LatLng(VENUE.lat,VENUE.lng));
      naver.maps.Service.geocode({query:VENUE.addr},(st,res)=>{ const a=res&&res.v2&&res.v2.addresses&&res.v2.addresses[0]; if(st!==naver.maps.Service.Status.OK||!a) return ph('지도를 불러오지 못했어요'); draw(new naver.maps.LatLng(+a.y,+a.x)); }); };
    s.onerror=()=>ph('지도를 불러오지 못했어요'); document.head.appendChild(s); return;
  }
  if(CONFIG.KAKAO_JS_KEY){
    const s=document.createElement('script'); s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_JS_KEY}&libraries=services&autoload=false`;
    s.onload=()=>kakao.maps.load(()=>{ const geo=new kakao.maps.services.Geocoder(); geo.addressSearch(VENUE.addr,(r,st)=>{ if(st!==kakao.maps.services.Status.OK) return; const p=new kakao.maps.LatLng(r[0].y,r[0].x); const m=new kakao.maps.Map(box,{center:p,level:3}); new kakao.maps.Marker({map:m,position:p}); m.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT); }); });
    document.head.appendChild(s); return;
  }
  if(sandboxed) return ph('실시간 네이버 지도는 도메인 연결 후 표시돼요<br>아래 지도 앱 버튼으로 바로 열 수 있어요');
  box.innerHTML=`<iframe loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(VENUE.addr+' '+VENUE.name)}&z=16&output=embed" title="경기교총웨딩하우스 지도"></iframe>`;
})();
